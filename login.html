<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="loginjs.js" defer></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			font-family: Cambria;
			background: linear-gradient(to bottom, #22023a, #cb9be7, #ffffff);
		}

		.main {
			width: 350px;
			height: 600px;
			overflow: hidden;
			border-radius: 10px;
			box-shadow: 5px 20px 50px #000;
		}

		#chk {
			display: none;
		}

		.login {
			position: relative;
			width: 100%;
			height: 100%;
		}

		label {
			color: #430d54;
			font-size: 2.3em;
			justify-content: center;
			display: flex;
			margin: 60px;
			font-weight: bold;
			cursor: pointer;
			transition: .5s ease-in-out;
		}

		input {
			width: 80%;
			height: 30px;
			background: #e0dede;
			justify-content: center;
			display: flex;
			margin: 20px auto;
			padding: 10px;
			border: none;
			outline: none;
			border-radius: 5px;
		}

		button {
			width: 80%;
			height: 40px;
			margin: 10px auto;
			justify-content: center;
			display: block;
			color: #fff;
			background: #573b8a;
			font-size: 1em;
			font-weight: bold;
			margin-top: 20px;
			outline: none;
			border: none;
			border-radius: 5px;
			transition: .2s ease-in;
			cursor: pointer;
		}

		button:hover {
			background: #6d44b8;
		}

		.signin {
			height: 600px;
			background: #eee;
			border-radius: 60% / 10%;
			transform: translateY(-180px);
			transition: .8s ease-in-out;
		}

		.signinlabel {
			color: #573b8a;
			transform: scale(.6);
		}

		#chk:checked~.signin {
			transform: translateY(-700px);
		}

		#chk:checked~.signin label {
			transform: scale(1);
		}

		#chk:checked~.login label {
			transform: scale(.6);
		}
	</style>
</head>

<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">
        <div class="login">
            <form onsubmit="return validateLogin()" action="websitehp.html">
                <label for="chk" aria-hidden="true" class="loginlabel">Login</label>
                <input type="email" id="loginEmail" name="email" placeholder="Email" required>
                <input type="password" id="loginPassword" name="pswd" placeholder="Password" required>
                <button class="button">Login</button>
            </form>
        </div>
        <div class="signin">
            <form onsubmit="return validateSignUp()"action="websitehp.html">
                <label for="chk" aria-hidden="true" class="signinlabel">Sign Up</label>
                <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
                <input type="email" id="signupEmail" name="email" placeholder="Email" required>
                <input type="tel" id="contactNumber" name="phone" placeholder="Contact Number" required>
                <input type="password" id="signupPassword" name="password" placeholder="Password" required>
                <button class="button" onclick="signup()">Sign Up</button>
            </form>
        </div>
    </div>
</body>

</html>
