<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Cambria, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        .header {
            text-align: center;
            background: #d5a4cf;
            padding: 20px 0;
            color: #fff;
            font-weight: bold;
        }

        .message-container {
            margin: 20px;
            padding: 50px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #6a0572;
            text-align: center;
        }

        .back-to-home {
            margin-top: 20px;
            text-align: center;
        }

        .back-button {
            background-color: #6a0572;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #4b034b;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>A R T S Y</h1>
    </div>
    <div class="message-container">
        <p class="message">Your order has been successfully placed!</p>
        <div class="back-to-home">
            <a href="websitehp.html"><button class="back-button">Back to Homepage</button></a>
        </div>
    </div>
</body>

</html>
