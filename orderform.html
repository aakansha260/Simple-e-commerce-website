<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="formjs.js" defer></script>
    <title>A R T S Y</title>
    <style>
        body {
            background-color: rgb(255, 248, 248);
            font-family: Cambria, sans-serif;
            color: #262626;
            margin: 5% 0;
        }

        .navbar {
            background-color: #311b58;
            overflow: hidden;
            padding: 10px 0;
        }

        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: white;
            color: black;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .d-flex {
            display: flex;
            justify-content: space-between;
            background: rgb(252, 248, 242);
            border-radius: 0 0 5px 5px;
            padding: 25px;
        }

        .form-container,
        .Yorder {
            flex: 1;
            padding: 0 20px;
        }

        .title {
            background-color: #c985c1;
            border-radius: 5px 5px 0 0;
            padding: 20px;
            color: #fff;
        }

        h2 {
            margin: 0;
        }

        .required {
            color: red;
        }

        label {
            display: block;
            margin: 15px 0;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dadada;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 30px;
            background: #52ad9c;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #428a7d;
        }

        .payment-methods input[type="radio"] {
            margin-right: 10px;
        }

        footer {
            background-color: #d5a4cf;
            text-align: center;
            padding: 8px 0;
            color: #fff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">
            <h2>A R T S Y</h2>
        </div>
        <div class="navbar">
            <a href="websitehp.html"><i class="fa fa-home" aria-hidden="true"></i></a>
            <a href="c.html"><i class="fa fa-shopping-cart" aria-hidden="true"></i></a>
            <a href="wishlist.html"><i class="fa fa-heart" aria-hidden="true"></i></a>
            <a href="user.html"><i class="fa fa-user-circle" aria-hidden="true"></i></a>
        </div>
        <div class="d-flex">
            <div class="form-container">
                <form id="orderForm" onsubmit="return valiatdeForm();" action="last.html">
                    <label for="name">Full Name:</label>
                    <input type="text" id="nameField" name="name" required><br>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required><br>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required><br>

                    <label for="address">Shipping Address:</label>
                    <input type="text" id="address" name="address" required><br>

                    <label for="state">State:</label>
                    <select id="state" name="state" required>
                        <option value="" disabled selected>Select State</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and
                            Diu</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Puducherry">Puducherry</option>
                    </select>


                    <label for="zip">ZIP Code:</label>
                    <input type="text" id="zip" name="zip" required><br>

                    <button type="submit" value="Submit">Place Order</button>
                </form>
            </div>
            <div class="Yorder">
                <h3>Your Order</h3>
                <table>
                    <tr>
                        <td>Product Name:</td>
                        <td>Water lilies by Claude Monet</td>
                    </tr>
                    <tr>
                        <td>Price:</td>
                        <td>₹4,750</td>
                    </tr>
                    <tr>
                        <td>Shipping:</td>
                        <td>₹499.00</td>
                    </tr>
                    <tr>
                        <td>Total:</td>
                        <td>₹5,249</td>
                    </tr>


                </table>
                <div class="payment-methods">
                    <label>Payment Method:</label>
                    <input type="radio" id="cashOnDelivery" name="paymentMethod" value="cashOnDelivery" required>
                    <label for="cashOnDelivery">Cash on Delivery</label>
                    <input type="radio" id="creditCard" name="paymentMethod" value="creditCard" required>
                    <label for="creditCard">Credit Card</label>
                    <input type="radio" id="debitCard" name="paymentMethod" value="debitCard" required>
                    <label for="debitCard">Debit Card</label>
                    <input type="radio" id="upi" name="paymentMethod" value="upi" required>
                    <label for="upi">UPI</label>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer">
            <p>&copy; 2023 ARTSY. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
